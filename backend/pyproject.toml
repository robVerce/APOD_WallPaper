[project]
name = "apod_wallpaper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=11.3.0",
    "pywebview>=6.2.1",
    "requests>=2.32.5",
    "screeninfo>=0.8.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"apod_wallpaper" = "src"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
